# CI / verify-stack: same as open-mode local backends plus GitHub behind OAuth.
# Used to prove the GitHub MCP server is wired through the gateway (401 without auth).

artifactory:
  name: artifactory
  description: JFrog Artifactory MCP server (local Docker)
  endpoint: http://artifactory-mcp:8091/mcp

gdrive:
  name: gdrive
  description: Google Drive + Docs MCP server (local Docker)
  endpoint: http://gdrive-mcp:8092/mcp

github:
  name: github
  description: GitHub MCP server (per-user OAuth)
  endpoint: http://github-mcp:8080/mcp
  auth_provider: github
